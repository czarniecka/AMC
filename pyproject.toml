[project]
name = "amc-project"
version = "0.1.0"
description = "Collection and classification tools for AMC: YouTube, job ads (KPRM, Hacker News) and Wykop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "langdetect>=1.0.9,<2",
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1.5",
    "pandas>=2.2,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32.4,<3",
    "streamlit>=1.40,<2",
    "youtube-transcript-api>=1.2,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "ruff==0.11.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
